name: 22569

on:
  schedule:
    # 每天UTC时间2点自动检查（北京时间10点）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      branch_name:
        description: '新分支名称'
        required: true
        default: '2256569'
        type: string
      force_sync:
        description: '强制同步（即使没有更新）'
        required: false
        default: false
        type: boolean

jobs:
  smart-sync:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1: 检出当前仓库
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 获取完整历史记录

      # 步骤2: 配置 Git 用户信息
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"

      # 步骤3: 添加上游仓库并检查可用性
      - name: Add upstream and check availability
        id: upstream-check
        run: |
          # 添加上游仓库
          git remote add upstream https://github.com/a2256569/tv.git
          
          # 尝试获取上游信息，设置超时防止长时间等待
          timeout 30s git fetch upstream main || {
            echo "❌ 上游仓库无法访问或已删除"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
            echo "upstream_accessible=false" >> $GITHUB_OUTPUT
            exit 0
          }
          
          echo "✅ 上游仓库可访问"
          echo "upstream_accessible=true" >> $GITHUB_OUTPUT
          
          # 比较本地和上游的提交差异
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          LOCAL_HASH=$(git rev-parse main)
          
          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "📭 没有检测到新更新，哈希值相同: $UPSTREAM_HASH"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "📬 检测到新更新!"
            echo "本地哈希: $LOCAL_HASH"
            echo "上游哈希: $UPSTREAM_HASH"
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      # 步骤4: 条件执行 - 只在有更新时同步
      - name: Sync upstream changes
        if: steps.upstream-check.outputs.skip_sync == 'false' && steps.upstream-check.outputs.upstream_accessible == 'true'
        run: |
          echo "🔄 开始同步上游更新..."
          git checkout main
          
          # 使用 rebase 方式合并，保持历史整洁
          git rebase upstream/main
          
          # 推送更新
          git push origin main
          git push --tags --force origin
          echo "✅ 同步完成"

      # 步骤5: 创建或更新分支（只在有同步时执行）
      - name: Create or update branch
        if: steps.upstream-check.outputs.skip_sync == 'false' && steps.upstream-check.outputs.upstream_accessible == 'true'
        run: |
          NEW_BRANCH="${{ github.event.inputs.branch_name || '比2256569' }}"
          
          # 检查分支是否存在
          if git show-ref --verify --quiet refs/heads/$NEW_BRANCH; then
            echo "🔄 更新已存在的分支: $NEW_BRANCH"
            git checkout $NEW_BRANCH
            git rebase main  # 将主分支的更新rebase到特性分支
            git push --force-with-lease origin $NEW_BRANCH
          else
            echo "🌱 创建新分支: $NEW_BRANCH"
            git checkout -b $NEW_BRANCH
            git push -u origin $NEW_BRANCH
          fi
          echo "✅ 分支处理完成: $NEW_BRANCH"

      # 步骤6: 处理上游不可用的情况
      - name: Handle upstream unavailable
        if: steps.upstream-check.outputs.upstream_accessible == 'false'
        run: |
          echo "🚫 上游仓库无法访问，跳过同步"
          echo "这可能是因为:"
          echo "1. 上游仓库已删除"
          echo "2. 网络连接问题"
          echo "3. 仓库权限变更"
          echo "请检查上游仓库状态: https://github.com/a2256569/tv"

      # 步骤7: 处理无更新的情况
      - name: Handle no updates
        if: steps.upstream-check.outputs.skip_sync == 'true' && steps.upstream-check.outputs.upstream_accessible == 'true'
        run: |
          echo "✅ 检查完成 - 无需同步"
          echo "本地仓库已是最新状态"
          echo "上游仓库: a2256569/tv"
          echo "目标仓库: F1-F/K1"
          echo "检查时间: $(date)"

      # 步骤8: 强制同步选项（手动触发时可用）
      - name: Force sync when requested
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_sync == 'true'
        run: |
          echo "🔨 强制执行强制同步..."
          git checkout main
          git reset --hard upstream/main
          git push --force origin main
          
          # 更新分支
          NEW_BRANCH="${{ github.event.inputs.branch_name || '2256569' }}"
          if git show-ref --verify --quiet refs/heads/$NEW_BRANCH; then
            git checkout $NEW_BRANCH
            git reset --hard main
            git push --force origin $NEW_BRANCH
          else
            git checkout -b $NEW_BRANCH
            git push -u origin $NEW_BRANCH
          fi
          echo "✅ 强制同步完成"

      # 步骤9: 最终状态报告
      - name: Final status report
        run: |
          echo "================================="
          echo "📊 同步作业状态报告"
          echo "================================="
          echo "上游仓库状态: ${{ steps.upstream-check.outputs.upstream_accessible == 'true' && '可访问' || '不可访问' }}"
          echo "同步执行状态: ${{ steps.upstream-check.outputs.skip_sync == 'false' && '已执行' || '已跳过' }}"
          echo "触发方式: ${{ github.event_name }}"
          echo "执行时间: $(date)"
          echo "作业结果: ${{ job.status }}"
          echo "================================="
